name: Build and deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm image exists
        run: docker buildx imagetools inspect "$IMAGE_REPOSITORY:$IMAGE_TAG"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${DEPLOY_HOST_KEY:?DEPLOY_HOST_KEY is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]

          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [[ "$DEPLOY_PORT" == "22" ]]; then
            printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            printf '[%s]:%s %s\n' "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]]
          incoming_suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_incoming="docker-compose.yml.${incoming_suffix}.incoming"
          production_incoming="docker-compose.production.yml.${incoming_suffix}.incoming"
          script_incoming="deploy-docker.sh.${incoming_suffix}.incoming"
          ssh_options=(
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -p "$DEPLOY_PORT"
          )
          scp_options=(
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -P "$DEPLOY_PORT"
          )
          printf -v deploy_path_quoted '%q' "$DEPLOY_PATH"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p -- $deploy_path_quoted"
          printf -v base_incoming_quoted '%q' "$base_incoming"
          printf -v production_incoming_quoted '%q' "$production_incoming"
          printf -v script_incoming_quoted '%q' "$script_incoming"
          printf -v base_remote_path '%q' "$DEPLOY_PATH/$base_incoming"
          printf -v production_remote_path '%q' "$DEPLOY_PATH/$production_incoming"
          printf -v script_remote_path '%q' "$DEPLOY_PATH/$script_incoming"
          cleanup() {
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "rm -f -- $deploy_path_quoted/$base_incoming_quoted $deploy_path_quoted/$production_incoming_quoted $deploy_path_quoted/$script_incoming_quoted" || true
          }
          trap cleanup EXIT
          scp "${scp_options[@]}" docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$base_remote_path"
          scp "${scp_options[@]}" docker-compose.production.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$production_remote_path"
          scp "${scp_options[@]}" scripts/deploy-docker.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$script_remote_path"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH=$deploy_path_quoted BASE_INCOMING=$base_incoming_quoted PRODUCTION_INCOMING=$production_incoming_quoted SCRIPT_INCOMING=$script_incoming_quoted bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cleanup() {
            rm -f -- \
              "$DEPLOY_PATH/$BASE_INCOMING" \
              "$DEPLOY_PATH/$PRODUCTION_INCOMING" \
              "$DEPLOY_PATH/$SCRIPT_INCOMING"
          }
          trap cleanup EXIT
          chmod 700 -- "$DEPLOY_PATH/$SCRIPT_INCOMING"
          mv -f -- "$DEPLOY_PATH/$BASE_INCOMING" "$DEPLOY_PATH/docker-compose.yml"
          mv -f -- "$DEPLOY_PATH/$PRODUCTION_INCOMING" "$DEPLOY_PATH/docker-compose.production.yml"
          mv -f -- "$DEPLOY_PATH/$SCRIPT_INCOMING" "$DEPLOY_PATH/deploy-docker.sh"
          trap - EXIT
          REMOTE_SCRIPT
          trap - EXIT

      - name: Deploy image
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i ~/.ssh/id_ed25519
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -p "$DEPLOY_PORT"
          )
          printf -v image_repository_quoted '%q' "$IMAGE_REPOSITORY"
          printf -v image_tag_quoted '%q' "$IMAGE_TAG"
          printf -v deploy_path_quoted '%q' "$DEPLOY_PATH"
          printf '%s' "$GITHUB_TOKEN" | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE_REPOSITORY=$image_repository_quoted IMAGE_TAG=$image_tag_quoted GHCR_USERNAME=${GITHUB_ACTOR@Q} $deploy_path_quoted/deploy-docker.sh"
